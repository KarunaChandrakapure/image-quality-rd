# ============================================================
#  config.yaml - settings for enhance.py and make_video.py
# ============================================================

# ---------------- enhance.py ----------------
input_dir: "F:/kpit/image-data-quality/argo_waymo_scenes"
output_dir: "F:/kpit/image-data-quality/output/enhanced"   # sub-folder structure of the input is kept
save_comp_frame: false         # true  = save raw | enhanced side by side
                              # false = save only the enhanced image
comp_layout: "side_by_side"   # side_by_side | stacked (raw on top)
output_format: "png"          # png | jpg | same (keep the input's extension)
extensions: [".jpg", ".jpeg", ".png", ".bmp", ".tif", ".tiff", ".webp"]

resize:
  mode: "width"               # width = scale to `width`, keep aspect ratio
                              # exact = stretch to width x height   | none = keep original size
  width: 448
  height: 256

# Night = high sensor noise AND (dark overall OR dark sky). Day frames get the
# "day" treatment below, night frames the "night" treatment.
night_check:
  min_noise: 1.0              # nuScenes night ~1.6-2.4, day frames of all datasets ~0.3-0.8
  max_brightness: 80          # mean brightness 0-255
  max_sky_brightness: 85      # mean brightness of the top `sky_fraction` of the frame
  sky_fraction: 0.25

# ---------------- Day: pull every image to one consistent look ----------------
# Targets taken from Argoverse (most natural of nuScenes / Argo / Waymo).
# Strengths found by automatic tuning on all three datasets.
day:
  target_brightness: 105      # mean luma 0-255
  target_contrast: 50         # std of luma
  target_colour: 6.0          # mean |Cr-128|,|Cb-128|  (nuScenes ~2.6, Argo ~5.3, Waymo ~12)
  denoise_min_noise: 0.9      # denoise only frames noisier than this
  white_balance:
    strength: 0.90            # share of the colour tint removed (Waymo is blue)
    max_shift: 20
    neutral_chroma: 20        # pixels with less colour than this should be grey
  tone:
    strength: 0.96            # how far brightness moves toward the target
    levels_clip: 0.5          # % of pixels allowed to clip when stretching
    levels_max_gain: 1.11
    gamma_min: 0.6
    gamma_max: 1.5
  local_contrast:             # CLAHE, stronger for flat images
    base: 0.13
    gain: 0.10
    max: 0.45
    clip: 1.5
    tile: 8
  sharpen:                    # edge-gated CAS, stronger for blurrier images
    base: 0.43
    blur_gain: 2.0
    blur_ref: 0.28
    max: 1.0
  color:                      # vibrance-style: dull colours boosted, vivid ones protected
    strength: 0.61            # raise (e.g. 0.8) for more colour pop
    min_factor: 0.6
    max_factor: 2.8
    protect: 37
    dark_protect: 0.15

# ---------------- Night: less grain + sharper, glare left untouched ----------------
night:
  glare:                      # headlights / street lamps + their glow and road reflections
    light_threshold: 0.92
    min_light_px: 3
    halo_threshold: 0.70
    halo_search_px: 4
    halo_max_px: 20
    margin_px: 4
    feather_px: 3
  denoise_h_per_sigma: 2.5    # night grain is heavier than day noise
  sharpen_amount: 0.6

# ---------------- night_enhance.py (night data only) ----------------
# Denoise + sharpen (as in "night" above) + reduce the glare intensity. Glare zone,
# denoise and sharpen settings are shared with the "night" / "denoise" / "sharpen" blocks.
night_enhance:
  input_dir: "F:/kpit/image-data-quality/sample4"
  output_dir: "F:/kpit/image-data-quality/output/night"
  save_comp_frame: true       # true = raw | enhanced side by side, false = enhanced only
  only_night_frames: false    # true = day frames found in the folder are copied unchanged
  glare_reduction:            # turns the glow / road reflections down without blurring:
    enabled: true             # only the smooth glow is reduced, edges and texture are
    strength: 0.8             # kept at full contrast.
                              # 0-1: 0.3 = subtle, 0.5 = clear, 0.8 = strong
    knee: 0.5                # MAIN CONTROL: only glow brighter than this (0-1) is reduced.
                              # With strength 0.8 -> glare removed: 0.3 = 26%, 0.4 = 18%,
                              # 0.5 = 11%, 0.6 = 5%, 0.7 = 2% (almost nothing)
    glow_radius: 4            # px, fine-tuning only. 2-8 works (4 = best detail);
                              # above ~30 it blurs the whole frame and switches the effect off
    min_keep: 0.6             # never darken a pixel below this share of its brightness
    detail_gain: 1.1          # >1 slightly boosts edges inside the glare zone
    keep_lights: true         # the lamp / headlight itself stays white

# ---------------- Shared by day and night ----------------
denoise:                      # non-local means, stronger in dark areas
  h_per_sigma: 1.77           # strength = this x measured noise (day; night: night.denoise_h_per_sigma)
  h_min: 3
  h_max: 9
  color_h: 3
  dark_factor: 1.3
  bright_factor: 0.7
  dark_level: 0.10
  bright_level: 0.40
sharpen:                      # edge gate + skip of flat dark areas (night sky)
  edge_sigma: 1.2
  edge_low: 0.08
  edge_high: 0.35
  flat_dark_level: 0.08
  flat_std: 0.02

# ---------------- make_video.py ----------------
video:
  output_dir: "F:/kpit/image-data-quality/output/videos"
  fps: 10
  height: 256                 # every view is scaled to this height (keeps aspect ratio)
  columns: 0                  # views per row in the stacked video, 0 = all in one row
