# ============================================================
#  night_clean_config.yaml  -  settings for 7.night_clean.py
#  Per image:  1. resize  2. is it a night frame?  3. find the glare zone
#              (headlights, street lamps, their glow and wet-road reflections)
#              4. outside the glare zone: denoise (less grain) + sharpen
#                 inside the glare zone: left exactly as the original
#  Edit values here, then re-run the script. No code changes needed.
# ============================================================

general:
  input_dir: "F:/kpit/image-data-quality/sample4"
  output_dir: "F:/kpit/image-data-quality/output"   # results go to output/<input folder>_clean/
  extensions: [".jpg", ".jpeg", ".png", ".bmp", ".tif", ".tiff", ".webp"]
  recursive: false
  limit: 0                    # first N images only (0 = all)
  output_format: "png"
  jpg_quality: 95
  # One output file per input (same name). Each image is resize.width x resize.height.
  #   write_original  write_result   file contains
  #   true            true           original + result, joined per layout
  #   false           true           result only - model-ready
  # Day frames (and night frames with nothing to do) are written as the original only.
  write_original: true
  write_result: true
  layout: "side_by_side"      # side_by_side | stacked
  save_mask: true             # also save the glare zone as a black/white image in
                              # <output>/_glare_masks/ (white = left untouched)
  save_report: true           # _report.csv: night?, brightness, noise, glare %, actions

# ---------------- Step 1: resize (same as adaptive_config.yaml) ----------------
resize:
  enabled: true
  width: 448
  height: 256
  mode: "stretch"             # stretch | pad | crop
  pad_value: 0
  interpolation: "area"

# ---------------- Step 2: night detection ----------------
night:                        # a frame is night if EITHER test says so
  max_brightness: 80          # mean brightness 0-255 below this = night.
                              # nuScenes: day frames 94-116, dark night frames 25-79
  max_sky_brightness: 85      # mean brightness of the top of the frame below this = night.
                              # Catches brightly lit night streets (shops, lamps), whose
                              # overall brightness (80-105) looks like day but whose sky is
                              # dark. nuScenes: night top 13-71, day top 94-158
  sky_fraction: 0.25          # top quarter of the frame is used for the sky test
  process_day_frames: false   # false = day frames are passed through unchanged

# ---------------- Step 3: glare zone ----------------
glare:
  light_threshold: 0.92       # brightness 0-1 above which a pixel is a light source (lamp core)
  min_light_px: 3             # ignore lone bright specks smaller than this (px area)
  halo_threshold: 0.70        # bright pixels above this that TOUCH a light source are its glow /
                              # reflection (e.g. the streak on a wet road). Lower = bigger zone
  halo_search_px: 4           # how close (px) a glow region must come to a light to belong to it
  halo_max_px: 20             # glow is never further than this (px) from a light source, so
                              # a white car next to a lit shopfront isn't swallowed into the zone
  margin_px: 4                # extra safety border around the whole zone
  feather_px: 3               # soft transition, so the untouched zone blends in without a seam

# ---------------- Step 4: outside the glare zone ----------------
clean:
  denoise:
    enabled: true
    h_per_sigma: 2.5          # brightness denoise strength = this x measured noise (night ~2 -> h~5)
    h_min: 3
    h_max: 9
    color_h: 4                # colour speckle removal (night frames have a lot). 0 = off
    template_window: 5        # smaller = less "painted" look
    search_window: 15
    adaptive:                 # night noise is worst in the dark: denoise harder there,
      enabled: true           # gentler in lit areas so real texture (road, plates) is kept
      dark_factor: 1.3        # strength multiplier in dark areas
      bright_factor: 0.7      # strength multiplier in lit areas
      dark_level: 0.10        # local brightness 0-1 at or below this = "dark"
      bright_level: 0.40      # local brightness at or above this = "lit" (blend in between)
      radius: 8               # px. Size of the area used to judge local brightness
  sharpen:                    # edge-gated CAS (4.cas_sharpen.py): outlines only, not noise
    enabled: true
    amount: 0.6               # CAS strength 0-1
    edge_sigma: 1.5           # blur before finding edges; larger ignores leftover noise
    edge_low: 0.08            # weaker edges than this are not sharpened
    edge_high: 0.30           # stronger edges than this get full sharpening
    skip_flat_dark:           # never sharpen the night sky / unlit flat areas - they hold
      enabled: true           # nothing but leftover noise
      dark_level: 0.08        # local brightness 0-1 below this counts as dark
      flat_std: 0.02          # local variation below this counts as featureless
      radius: 6               # px
