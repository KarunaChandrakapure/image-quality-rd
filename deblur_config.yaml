# ============================================================
#  deblur_config.yaml  -  settings for deblur_compare.py
#  Edit values here, then re-run the script. No code changes needed.
# ============================================================

general:
  output_dir: "output"        # folder where every result + the comparison image is saved
  max_side: null              # e.g. 2000 -> shrink input if its longest side is larger (speeds up
                              # deconvolution on big images). null = keep original size
  save_individual: true       # also save each method's result as its own full-resolution file
  save_steps: false           # true = also save the image after EACH step of the "enhanced"
                              # pipeline (see what every step contributes)

# ---------------- Which methods to run (and in what order) ----------------
# Set any to false to leave it out of the comparison.
enabled:
  original: true
  unsharp_mask: true          # OpenCV unsharp mask
  pillow_unsharp: true        # Pillow UnsharpMask
  richardson_lucy: true       # deconvolution (needs a correct blur PSF below)
  wiener: true                # deconvolution, faster, less ringing-prone
  full_pipeline: true         # denoise -> upscale -> sharpen -> CLAHE
  enhanced: true              # NEW: no-resize all-round enhancement (see methods.enhanced)

# ---------------- Comparison image layout ----------------
comparison:
  columns: 3                  # images per row in the stacked comparison sheet
  cell_height: null           # height of each cell in px. null = original image height
  label_height: 40            # height of the title band above each image
  font_scale: 0.8
  # Zoom into one region so you can judge sharpness at 100%. Coordinates are in
  # pixels of the (possibly max_side-resized) ORIGINAL image.
  crop:
    enabled: false
    x: 100
    y: 100
    width: 300
    height: 300
    zoom: 2                   # enlarge the crop by this factor (nearest-neighbour)

# ============================================================
#  Method settings
# ============================================================
methods:

  # ---- 1. OpenCV unsharp mask ----
  unsharp_mask:
    sigma: 1.5                # blur radius used to find edges (1-3). Bigger = coarser sharpening
    amount: 1.5               # strength (0.5-2). Too high -> halos around edges
    threshold: 0              # 0-10. Leaves flat areas untouched (less noise boost)

  # ---- 2. Pillow unsharp mask ----
  pillow_unsharp:
    radius: 2                 # blur radius in px
    percent: 150              # strength in %
    threshold: 3              # minimum brightness change to sharpen

  # ---- Shared by the two deconvolution methods below ----
  # Describes HOW the image was blurred. This matters more than any other setting.
  psf:
    type: "gaussian"          # "gaussian" (out of focus / soft)  or  "motion" (camera/vehicle movement)
    gaussian_size: 9          # kernel size in px (odd number)
    gaussian_sigma: 1.2       # blur strength. Mild blur: 0.8-1.5, strong: 2-4. Use --sweep to find it
    motion_length: 15         # blur streak length in px
    motion_angle: 30          # blur direction in degrees (0 = horizontal)

  # ---- 3. Richardson-Lucy deconvolution ----
  richardson_lucy:
    num_iter: 10              # 5-10 = gentle, 20-30 = aggressive (more ringing/noise)
    luminance_only: true      # true = deblur brightness channel only (faster, fewer colour artifacts)
    clip: true                # clip values to valid range during iterations

  # ---- 4. Wiener deconvolution ----
  wiener:
    balance: 0.02             # regularisation. Higher (0.1+) = almost no change, lower (0.005) = sharper/noisier
    luminance_only: true

  # ---- 5. Full pipeline (steps always run in this order) ----
  full_pipeline:
    denoise:
      enabled: true
      h: 3                    # luminance denoise strength
      h_color: 3              # colour denoise strength
      template_window: 7
      search_window: 21
    upscale:
      enabled: false          # turn on for small / low-resolution images
      scale: 2
      interpolation: "lanczos"   # nearest | linear | cubic | lanczos
    sharpen:
      enabled: true
      method: "unsharp_mask"  # unsharp_mask | pillow_unsharp | richardson_lucy | wiener
      params: {}              # overrides for that method, e.g. { sigma: 1.2, amount: 1.2 }
    clahe:
      enabled: true
      clip_limit: 2.0         # local contrast boost on brightness only
      tile_grid: 8

  # ---- 6. ENHANCED: all-round improvement, output size is NEVER changed ----
  # Order: denoise -> white_balance -> tone -> local_contrast -> sharpen -> separation -> color
  # Turn any step off with enabled: false. Start gentle, then raise values.
  enhanced:

    denoise:                    # light cleanup so later steps don't amplify noise
      enabled: true
      h: 3
      h_color: 3
      template_window: 7
      search_window: 21

    white_balance:              # fixes colour cast (gray-world). Off by default: it can
      enabled: false            # wrongly "correct" scenes dominated by one colour
      strength: 0.5             # 0-1

    tone:                       # GOAL 4: lighting / brightness
      enabled: true
      auto_levels: true         # stretch brightness so darkest/brightest pixels use full range
      clip_low: 0.5             # % of darkest pixels allowed to clip to black
      clip_high: 0.5            # % of brightest pixels allowed to clip to white
      auto_gamma: true          # automatically brighten dark / darken bright images
      target_mean: 0.48         # desired average brightness (0-1) for auto_gamma
      gamma_min: 0.7            # limits so auto_gamma can't go overboard
      gamma_max: 1.3
      gamma: 1.0                # used only when auto_gamma is false (<1 brighter, >1 darker)
      shadows: 0.15             # 0-0.5, lifts dark areas to reveal hidden detail
      highlights: 0.10          # 0-0.5, pulls back blown-out bright areas
      tonal_radius: 30          # how "local" the shadow/highlight adjustment is (px)

    local_contrast:             # GOAL 2: better visibility of all elements
      enabled: true
      clahe_clip: 1.5           # 1-4, local contrast strength (higher can make flat areas blotchy)
      tile_grid: 8
      clahe_strength: 0.4       # 0-1, how much CLAHE is blended in (lower = more natural)
      clarity_amount: 0.25      # 0-1, mid-tone punch (large-radius sharpening)
      clarity_radius: 25        # px

    sharpen:                    # GOAL 1: sharp image
      enabled: true
      method: "unsharp_mask"    # none | unsharp_mask | richardson_lucy | wiener | pillow_unsharp
      luminance_only: true      # unsharp_mask on brightness only = no coloured halos
      params: {}                # overrides, e.g. { sigma: 1.2, amount: 1.0 }

    separation:                 # GOAL 3: foreground vs background
      enabled: true
      mask: "grabcut"           # grabcut = subject in the middle | focus = sharper areas are
                                # foreground | center = soft oval around the middle
      grabcut_margin: 0.05      # 0-0.4, border fraction assumed to be background
      grabcut_iter: 5
      grabcut_work_size: 600    # GrabCut runs on a smaller internal copy for speed
                                # (the OUTPUT is not resized)
      focus_window: 25          # used by mask: focus (bigger = smoother mask)
      center_radius: 0.5        # used by mask: center (bigger = larger foreground area)
      feather: 15               # edge softness of the mask in px (avoids visible cut-outs)
      fg_brightness: 1.05       # >1 brightens subject
      fg_saturation: 1.10
      bg_brightness: 0.85       # <1 darkens background
      bg_saturation: 0.85
      bg_blur: 0                # >0 softly blurs background (e.g. 3). 0 = no blur

    color:                      # GOAL 4: saturation
      enabled: true
      saturation: 1.05          # overall (1.0 = unchanged)
      vibrance: 0.25            # 0-1, boosts dull colours more than already-vivid ones

# ============================================================
#  Sweep settings - used by:  python deblur_compare.py img.jpg --sweep wiener
#                             python deblur_compare.py img.jpg --sweep rl
#  Produces ONE sheet: each row = a different blur kernel, each column = a different
#  Wiener balance (or RL iteration count). Tip: enable comparison.crop to judge at 100%.
# ============================================================
sweep:
  gaussian_sigmas: [0.8, 1.2, 1.6, 2.2]   # one row per value (soft / out-of-focus blur)
  motion_lengths: [3, 5, 7, 9]            # one row per value (movement blur)
  motion_angle: 0                         # 0 = horizontal. Try 90 for vertical blur
  wiener_balances: [0.003, 0.01, 0.03]    # columns for --sweep wiener
  rl_iters: [5, 10, 20]                   # columns for --sweep rl

# ============================================================
#  Batch settings - used by:
#     python deblur_compare.py --batch my_folder
#     python deblur_compare.py --batch my_folder --method pillow_unsharp --limit 5
#  Every image gets the SAME method + settings from the "methods" section above.
#  Output keeps the original file names and image size (subfolders are mirrored).
#  Tip: decide the method on a few images with the normal comparison mode first,
#  then use --limit 5 for a test run before processing everything.
# ============================================================
batch:
  method: "enhanced"          # unsharp_mask | pillow_unsharp | richardson_lucy | wiener |
                              # full_pipeline | enhanced   (can be overridden with --method)
  recursive: false            # true = also process images inside subfolders
  extensions: [".jpg", ".jpeg", ".png", ".bmp", ".tif", ".tiff", ".webp"]
  output_format: "same"       # same | png | jpg.  Use png if the images feed a model: no extra
                              # JPEG compression artifacts
  jpg_quality: 95             # only used when saving JPEG files
  overwrite: false            # false = skip files that already exist (lets you resume a batch)
  workers: 1                  # parallel processes. 0 = use all CPU cores
  save_result: false          # true = also save the clean result image (same name/size as the input).
                              # false = ONLY the comparison images are saved
  save_comparison: true       # save an image showing ORIGINAL + RESULT together, per file
  comparison_layout: "side_by_side"   # side_by_side (Original | Result) or stacked (Original above Result)
  comparison_labels: true     # true = "Original" / method name written above each image
  comparison_dir: "_comparisons_{method}"   # subfolder for these images. {method} is replaced by the
                                      # method name, e.g. _comparisons_enhanced. Use "" to save
                                      # next to the result as <name>_compare.png
  save_report: true           # write _report.csv (size, sharpness before/after, time, status)